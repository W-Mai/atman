name: Client quality

on:
  pull_request:
    paths:
      - ".github/workflows/client-quality.yml"
      - "crates/atman-proto/**"
      - "packages/client/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "bun.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/client-quality.yml"
      - "crates/atman-proto/**"
      - "packages/client/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "bun.lock"

permissions:
  contents: read

concurrency:
  group: client-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: protocol-client
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Verify generated protocol and client
        run: bun run quality
