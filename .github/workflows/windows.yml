name: Windows product checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Check daemon
        run: cargo check -p atman-daemon --locked
      - name: Check CLI
        run: cargo check -p atman-cli --locked
      - name: Test advisory ownership and journal snapshots
        run: cargo test -p atman-runtime --lib --locked -- file_lock::tests event_log::journal::tests
      - name: Test first launch in a native terminal
        run: cargo test -p atman-cli --test startup_pty --locked
      - name: Test startup session lifecycle
        run: cargo test -p atman-cli --test peer_repl --locked -- automatic_startup_session_cleanup unused_session_discard
      - name: Build release binaries
        run: cargo build --release -p atman-daemon -p atman-cli --locked
      - name: Test release first launch in a native terminal
        run: cargo test --release -p atman-cli --test startup_pty --locked
      - name: Test platform primitives
        run: cargo test -p atman-runtime platform::tests --lib --locked
      - name: Test shell resolver
        run: cargo test -p atman-runtime shell::tests --lib --locked
      - name: Test Windows storage
        run: cargo test -p atman-runtime storage::tests --lib --locked
      - name: Test MCP paths
        run: cargo test -p atman-runtime mcp_config::tests --lib --locked
      - name: Test CLI recovery diagnostics
        run: cargo test -p atman-cli --bin atman continuation_replay_errors --locked
      - name: Test daemon RPC contract
        run: cargo test -p atman-daemon --test capabilities --locked
