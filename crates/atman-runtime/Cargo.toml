[package]
name = "atman-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = true
description = "Atman host runtime: executor, tool and provider dispatch, memory stores"
homepage = "https://atman.run"
repository = "https://github.com/W-Mai/atman"
keywords = ["atman", "runtime", "llm", "agent", "workflow"]
categories = ["development-tools", "asynchronous"]

[dependencies]
axum.workspace = true
atman-rt         = { path = "../atman-rt", version = "1.13.2" }
atman-macros = { path = "../atman-macros", version = "1.13.2" }
anyhow.workspace   = true
documented = "0.10"
sha2 = "0.10"
rand = "0.8"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
reqwest.workspace = true
htmd.workspace = true
command-group.workspace = true
eventsource-stream.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
base64.workspace = true
similar.workspace = true
rusqlite.workspace = true
regex.workspace = true
ignore.workspace = true
toml.workspace = true
toml_edit.workspace = true
blake3.workspace = true
git2.workspace = true
portable-pty.workspace = true
fs2.workspace = true
vt100.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
wiremock = "0.6"
