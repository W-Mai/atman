[package]
name = "atman-rt-mirui"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = ["sdl"]
sdl = ["mirui/sdl", "dep:sdl2"]

[dependencies]
atman-rt = { path = "../../crates/atman-rt" }
mirui = { version = "=0.46.3", default-features = false, features = ["std"] }
sdl2 = { version = "=0.37.0", optional = true, features = ["use-pkgconfig"] }

[workspace]
resolver = "3"
